version: "3.9"

# ═══════════════════════════════════════════════════════════
#  CAMS — Council Approval Management System
#  Production Docker Compose — External Database
# ═══════════════════════════════════════════════════════════
#
#  This file does NOT include a database container.
#  The database is hosted externally (Azure Postgres Flexible Server).
#
#  Setup:
#    1. Create Azure Database for PostgreSQL — Flexible Server
#    2. cp .env.production.example .env
#    3. Edit .env with your database connection string
#    4. docker compose -f docker-compose.external-db.yml up -d --build
#
# ═══════════════════════════════════════════════════════════

services:
  # ─── Backend API ───────────────────────────────────────
  approval-api:
    build:
      context: ./approval-backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # External database — set full connection string in .env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (64+ random chars)}
      DEBUG: "false"
      # Production: no demo accounts. First run creates one superadmin who must change password.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-superadmin@council.wa.gov.au}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT:-claude-sonnet-5-5}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI:-200}
      MAX_IMAGE_DIM: ${MAX_IMAGE_DIM:-2048}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-16000}   # 4096 truncates site-plan JSON
      DOCUMENT_DIR: /app/uploads/documents
      # Council area (used by geodata lookups)
      COUNCIL_BBOX: ${COUNCIL_BBOX:-115.95,-32.10,116.15,-31.87}
      COUNCIL_LGA_NAME: ${COUNCIL_LGA_NAME:-Kalamunda}
      COUNCIL_LGA_NO: ${COUNCIL_LGA_NO:-102}
      # Microsoft Entra ID sign-in (only active once tenant, client ID and secret are real values)
      ENTRA_ENABLED: ${ENTRA_ENABLED:-false}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_AUTO_CREATE_USER: ${ENTRA_AUTO_CREATE_USER:-true}
      ENTRA_DEFAULT_ROLE: ${ENTRA_DEFAULT_ROLE:-engineer}
      # Email notifications
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@council.wa.gov.au}
    volumes:
      - approval_uploads:/app/uploads
      - geojson_data:/app/geojson
    command: >
      sh -c '
        echo "Waiting for database..."
        python -c "
        import time, sys
        for i in range(30):
            try:
                from sqlalchemy import create_engine, text
                e = create_engine(\"${DATABASE_URL}\")
                with e.connect() as c: c.execute(text(\"SELECT 1\"))
                print(\"Database ready\"); break
            except: time.sleep(2); print(f\"Retry {i+1}/30...\")
        else: print(\"WARNING: DB not ready after 60s\"); sys.exit(1)
        " &&
        python -c "from app.seed import run_seed; run_seed()" &&
        gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${API_WORKERS:-2} --timeout 120
      '
    networks: [cams-net]
    healthcheck:
      # python:3.12-slim has no curl, so check with the image's own Python
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Frontend (Nginx + React SPA) ─────────────────────
  approval-frontend:
    build:
      context: ./approval-frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      approval-api:
        condition: service_healthy
    volumes:
      - geojson_data:/usr/share/nginx/html/geojson
    networks: [cams-net]

  # ─── Scheduled Tasks (weekly lot.geojson update) ───────
  cams-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    restart: always
    environment:
      # Write into the volume nginx serves .geojson files from (approval-frontend: /usr/share/nginx/html/geojson)
      GEOJSON_OUTPUT_DIR: /geojson
      COUNCIL_BBOX: ${COUNCIL_BBOX:-115.95,-32.10,116.15,-31.87}
      COUNCIL_LGA_NAME: ${COUNCIL_LGA_NAME:-Kalamunda}
      COUNCIL_LGA_NO: ${COUNCIL_LGA_NO:-102}
    volumes:
      - geojson_data:/geojson
      - cron_logs:/var/log/cams
    networks: [cams-net]

volumes:
  approval_uploads:
  geojson_data:
  cron_logs:

networks:
  cams-net:
    driver: bridge
