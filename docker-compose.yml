version: "3.9"

services:
  # ═══ DATABASES ═══════════════════════════════════════
  applicant-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cams_application
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pgdata_applicant:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cams_application"]
      interval: 5s
      timeout: 5s
      retries: 5

  approval-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cams_approval
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata_approval:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cams_approval"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══ BACKEND APIs ═══════════════════════════════════
  applicant-api:
    build: ./applicant-backend
    ports: ["8001:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@applicant-db:5432/cams_application
      SECRET_KEY: change-me-applicant-secret-key-64chars-random
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
      UPLOAD_DIR: /app/uploads
    depends_on:
      applicant-db: { condition: service_healthy }
    volumes: [applicant_uploads:/app/uploads]
    command: sh -c 'python -c "from app.seed import run_seed; run_seed()" && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'

  approval-api:
    build: ./approval-backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@approval-db:5432/cams_approval
      SECRET_KEY: change-me-approval-secret-key-64chars-random
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT}
      PDF_RENDER_DPI: ${PDF_RENDER_DPI}
      MAX_IMAGE_DIM: ${MAX_IMAGE_DIM}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS}

    depends_on:
      approval-db: { condition: service_healthy }
    command: sh -c 'python -c "from app.seed import run_seed; run_seed()" && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'

  # ═══ FRONTENDS ═════════════════════════════════════
  applicant-frontend:
    build: ./applicant-frontend
    ports: ["3000:3000"]
    depends_on: [applicant-api]

  approval-frontend:
    build: ./approval-frontend
    ports: ["3001:3001"]
    depends_on: [approval-api]

volumes:
  pgdata_applicant:
  pgdata_approval:
  applicant_uploads:
